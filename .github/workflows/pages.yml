name: Pages site

# Publishes the explicitly approved ISO-only player at the site root, together
# with documentation/developer tools. Large compiled companions come from a
# hash-pinned release, never Git. No ISO, extracted disc tree or saves are hosted.

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - 'profile/web/launcher/**'
      - 'profile/web/local_iso.js'
      - 'profile/translator/**'
      - 'patches/**'
      - 'scripts/setup.sh'
      - 'scripts/build_translator.sh'
      - 'scripts/build_pages_site.py'
      - 'scripts/install_pages_player.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the browser translator without game data
        run: |
          bash scripts/setup.sh
          bash scripts/build_translator.sh
      - name: Check site assembly, launcher and translator
        run: |
          python scripts/test_pages_site.py
          python scripts/test_pages_player.py
          node scripts/test_web_launcher.mjs
          node scripts/test_web_translator.mjs
      - name: Assemble site
        run: python scripts/build_pages_site.py --output build/pages-site --strict --translator build/translator-web --player
      - name: Read pinned player provenance
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from install_pages_player import read_config
          config = read_config(Path('docs/PAGES_PLAYER.json'))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('PLAYER_TAG=' + config['tag'] + '\n')
              stream.write('PLAYER_ASSET=' + config['asset'] + '\n')
          PY
      - name: Download the pinned player release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$PLAYER_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PLAYER_ASSET" --dir build/pages-player-release
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: build/pages-site
          destination: build/pages-output
      - name: Verify and install the ISO-only launcher
        run: |
          # Jekyll's Docker action owns its output as root. Copy into a fresh,
          # runner-owned tree before overlaying the verified player companions.
          python -c "import shutil; shutil.copytree('build/pages-output', 'build/pages-deploy')"
          python scripts/install_pages_player.py --site build/pages-deploy --archive "build/pages-player-release/$PLAYER_ASSET"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages-deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
